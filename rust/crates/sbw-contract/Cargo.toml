[package]
name = "sbw-contract"
version = "0.1.0"
description = "Proposed SuperbWarfare/Horizon component and multiplayer contract"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
client-bindings = []
server-bindings = []

[dependencies]
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
wit-bindgen = { version = "=0.60.0", default-features = false, features = ["macros", "realloc"] }

[dev-dependencies]
wit-component = "=0.254.2"
wit-parser = "=0.254.2"

[[example]]
name = "client_guest"
path = "tests/guests/client.rs"
crate-type = ["cdylib"]
required-features = ["client-bindings"]

[[example]]
name = "server_guest"
path = "tests/guests/server.rs"
crate-type = ["cdylib"]
required-features = ["server-bindings"]

[lints]
workspace = true
